
name: TestForge CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore TestForge.sln

      - name: Build solution
        run: dotnet build TestForge.sln --no-restore

      - name: Install Playwright Chromium
        run: pwsh TestForge.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run tests
        run: dotnet test TestForge.sln --no-build --settings playwright.runsettings

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: TestForge.Tests/bin/Debug/net10.0/TestResults/Playwright/
          if-no-files-found: ignore
